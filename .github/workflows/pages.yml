# الموقع + نسخة المتصفح: أي تعديل في الموقع أو الكود يتنشر لوحده على getwarraq.org
name: نشر الموقع ونسخة المتصفح

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'data/**'
      - 'build.py'
      - 'build_quran.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: بناء ورّاق (نص القرآن + البرنامج)
        run: |
          python build_quran.py
          python build.py

      - name: تجميع الموقع ونسخة المتصفح
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r dist/. _site/app/
          echo "getwarraq.org" > _site/CNAME
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
