<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورّاق – Warraq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap">
<style>
:root{
  --primary:#0F5F66; --primary-dark:#0B4C52; --primary-soft:#DCEFEE;
  --accent:#B8732E; --paper:#F4EFE6; --desk:#E9E3D7; --line:#DDD3C0;
  --ink:#2B2B2B; --muted:#6B6B6B;
  --ui-font:'Noto Naskh Arabic','Cairo',system-ui,sans-serif;
  --doc-font:'Amiri','Noto Naskh Arabic',serif;
  --zoom:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui-font);color:var(--ink);background:var(--desk);font-size:14px}
#app{display:flex;flex-direction:column;height:100vh}
button{font-family:inherit;font-size:13px;cursor:pointer}

/* title bar */
.titlebar{background:var(--primary);color:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:6px 12px;gap:8px}
.tb-start{display:flex;align-items:center;gap:8px;min-width:0}
.logo{display:inline-flex}
.app-name{font-family:'Amiri',serif;font-size:18px;font-weight:700}
.doc-title{background:transparent;border:1px solid transparent;color:var(--paper);font-family:inherit;font-size:14px;padding:2px 6px;border-radius:6px;width:220px;max-width:40vw}
.doc-title:hover,.doc-title:focus{border-color:#ffffff55;outline:none;background:#ffffff14}
.ext{color:#9FE1CB;font-size:12px;direction:ltr}
.save-state{background:var(--primary-dark);color:#9FE1CB;font-size:11px;padding:2px 10px;border-radius:10px;white-space:nowrap}
.save-state.dirty{color:#FAC775}
.tb-btn{background:var(--primary-dark);color:var(--paper);border:none;border-radius:6px;padding:4px 10px}

/* tabs + ribbon */
.tabs{background:var(--primary);display:flex;padding:0 10px;gap:2px;overflow-x:auto}
.tab{background:none;border:none;color:#E8F2F1;padding:7px 14px;font-size:13px;border-radius:8px 8px 0 0;white-space:nowrap}
.tab:hover{background:#ffffff1a}
.tab.on{background:var(--paper);color:var(--primary);font-weight:700}
.tab .soon-badge{font-size:10px;background:var(--accent);color:#fff;border-radius:8px;padding:0 6px;margin-inline-start:4px}
.ribbon{background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 10px;min-height:46px}
.rb{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;color:#33504F;display:inline-flex;align-items:center;gap:4px;min-height:30px}
.rb:hover{background:var(--primary-soft)}
.rb.on{background:var(--primary);color:var(--paper)}
.rb.outline{border-color:var(--line);background:#fff}
.rb.special{color:var(--accent);border-color:var(--accent)}
.rb b,.rb i,.rb u,.rb s{font-size:15px}
.rsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.rsel{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;min-height:30px}
.rlabel{font-size:12px;color:var(--muted)}
.ribbon .soon{color:var(--muted);font-size:13px;margin:0}

/* workspace */
.workspace{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr) 200px;min-height:0}
.panel{background:var(--paper);padding:10px;overflow:auto;font-size:13px}
.nav-panel{border-inline-end:1px solid var(--line)}
.ref-panel{border-inline-start:1px solid var(--line)}
.panel h3{font-size:14px;color:var(--primary);margin:0 0 8px;font-weight:700}
.panel .soon{color:var(--muted);font-size:12px;line-height:1.7}
.nav-item{display:block;width:100%;text-align:start;background:none;border:none;padding:4px 6px;border-radius:6px;color:#33504F;margin:1px 0}
.nav-item:hover{background:var(--primary-soft)}
.nav-item.l2{padding-inline-start:16px;font-size:12px}
.nav-item.l3{padding-inline-start:28px;font-size:12px;color:var(--muted)}
.nav-empty{color:var(--muted);font-size:12px;line-height:1.7}
body.hide-nav .nav-panel,body.hide-ref .ref-panel{display:none}
body.hide-nav .workspace{grid-template-columns:minmax(0,1fr) 200px}
body.hide-ref .workspace{grid-template-columns:190px minmax(0,1fr)}
body.hide-nav.hide-ref .workspace{grid-template-columns:minmax(0,1fr)}

.canvas{overflow:auto;padding:24px 16px 60px;display:flex;justify-content:center;align-items:flex-start}
.sheet{flex:none;height:auto}
.sheet{background:#fff;width:21cm;min-height:29.7cm;padding:2.5cm 2.5cm;border:1px solid #D9D0BE;box-shadow:0 1px 3px #0000001a;zoom:var(--zoom);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(29.7cm - 1px),#B8732E55 calc(29.7cm - 1px),#B8732E55 29.7cm);
  font-family:var(--doc-font)}
.sheet.letter{width:21.59cm;min-height:27.94cm}
.sheet.m-narrow{padding:1.27cm}
.sheet.m-wide{padding:2.54cm 5.08cm}
.page{font-size:16pt;line-height:1.5;outline:none;text-align:justify;word-wrap:break-word;min-height:20cm;position:relative}
.page.ls-1{line-height:1.15}.page.ls-15{line-height:1.5}.page.ls-2{line-height:2}.page.ls-115{line-height:1.3}
.page p{margin:0 0 .4em}
.page h1{font-size:1.6em;color:var(--primary);margin:.6em 0 .3em;font-weight:700}
.page h2{font-size:1.3em;color:var(--primary);margin:.5em 0 .3em;font-weight:700}
.page h3{font-size:1.1em;color:#33504F;margin:.4em 0 .2em;font-weight:700}
.page blockquote{margin:.4em 1.5em;padding:.2em 1em;border-inline-start:3px solid var(--accent);color:#444}
.page table{border-collapse:collapse;width:100%;margin:.4em 0}
.page td,.page th{border:1px solid #999;padding:4px 8px;vertical-align:top;min-width:2em}
.page th{background:#F4EFE6}
.page img{max-width:100%;height:auto}
.page.num-ar ol{list-style-type:arabic-indic}
.page hr.wq-pagebreak{border:none;border-top:2px dashed var(--accent);margin:1em 0;position:relative}
.page hr.wq-pagebreak::after{content:var(--pb-label);position:absolute;top:-.8em;inset-inline-start:50%;background:#fff;color:var(--accent);font-size:11px;font-family:var(--ui-font);padding:0 6px}
.page:empty::before{content:attr(data-placeholder);color:#aaa}
/* الحواشي والاستشهادات */
.wq-fn{color:var(--accent);cursor:pointer;font-size:.65em;vertical-align:super;line-height:0;padding:0 1px;user-select:none}
.wq-fn:hover,.wq-cite:hover{background:#FAEEDA;border-radius:3px}
.wq-cite{color:#0B4C52;cursor:pointer;border-bottom:1px dotted var(--accent);user-select:none}
.fn-zone{font-size:12pt;line-height:1.6;margin-top:1.2em}
.fn-zone:empty{display:none}
.fn-zone::before{content:'';display:block;width:35%;border-top:1px solid #999;margin-bottom:.4em}
.fn-item{margin:0 0 .2em;cursor:pointer;text-align:start}
.fn-item:hover{background:#FAEEDA}
.fn-num{color:var(--accent)}
.ibid{background:#FAEEDA;color:#854F0B;border-radius:3px;padding:0 3px}
.wq-toc,.wq-bib{border:1px dashed #B8732E88;border-radius:6px;padding:.4em .8em;margin:.6em 0;cursor:default;user-select:none}
.wq-block-title{font-size:1.3em;color:var(--primary);font-weight:700;margin:.2em 0 .4em}
.wq-block-sub{font-weight:700;color:#33504F;margin:.6em 0 .2em}
.toc-row{display:flex;gap:6px;align-items:baseline;cursor:pointer;margin:.1em 0}
.toc-row:hover{color:var(--primary)}
.toc-row .dots{flex:1;border-bottom:1px dotted #999;transform:translateY(-4px)}
.toc-row.l2{padding-inline-start:1.5em}.toc-row.l3{padding-inline-start:3em;font-size:.95em}
.bib-item{padding-inline-start:2em;text-indent:-2em;margin:0 0 .3em;text-align:start}
.wq-note{font-size:11px;color:var(--muted);font-family:var(--ui-font)}
/* لوحة المراجع */
.ref-search{width:100%;font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin-bottom:8px;background:#fff}
.ref-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;line-height:1.5}
.ref-card .ra{font-weight:700}
.ref-card .rm{color:var(--muted);font-size:11px}
.ref-card .acts{display:flex;gap:4px;margin-top:4px}
.ref-card .acts button{font-size:11px;border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:1px 6px;color:#33504F}
.ref-card .acts button.c{border-color:var(--accent);color:var(--accent)}
.ref-new{width:100%;margin-top:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 10px;font-size:12px;color:#33504F}
.chip.on{background:var(--primary);color:var(--paper);border-color:var(--primary)}
.modal textarea{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:10px;background:#fff;min-height:60px;resize:vertical}
.preview-box{background:#fff;border:1px dashed var(--accent);border-radius:6px;padding:8px;font-family:var(--doc-font);font-size:14px;line-height:1.7;margin-bottom:6px}
.modal.wide{width:min(560px,94vw)}
.tb-end{display:flex;gap:6px}
/* عرض الصفحات */
.pages-view{display:none}
body.pages-mode #sheet{display:none}
body.pages-mode .pages-view{display:flex;flex-direction:column;gap:24px;align-items:center}
.pv-page{background:#fff;border:1px solid #D9D0BE;box-shadow:0 1px 3px #0000001a;box-sizing:border-box;position:relative;zoom:var(--zoom);font-family:var(--doc-font);overflow:hidden;flex:none}
.pv-box{display:flex;flex-direction:column;overflow:hidden}
.page.pv-body{min-height:0;flex:none;outline:none}
.pv-fns{margin-top:auto;padding-top:6px}
.pv-fns.fn-zone{margin-top:auto}
.pv-num{position:absolute;left:0;right:0;text-align:center;font-size:12pt;color:#444}
.pv-cont{text-indent:0}
.pv-overflow{max-height:100%;overflow:hidden}
.pv-overflow img{max-height:20cm}
.pages-view .wq-toc,.pages-view .wq-bib{border:none;padding:0}
.pages-view .toc-row{cursor:default}
/* الآيات */
.wq-ayah{font-family:'Amiri Quran','Amiri',serif;color:#0B4C52;user-select:none;line-height:2.1}
.wq-ayah-ref{font-size:.8em;color:#555;user-select:none}
.ayah-bad{outline:2px solid #A32D2D}
.ayah-prev{font-size:18px;text-align:center;line-height:2.2}
.q-results{max-height:150px;overflow:auto;margin:-4px 0 10px}
.q-hit{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-family:'Amiri',serif;font-size:14px}
.q-hit:hover{border-color:var(--accent)}
/* شاشة البداية */
.start-ov{position:fixed;inset:0;background:var(--desk);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.start-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;width:min(860px,100%);padding:22px}
.start-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.start-head .logo svg{width:52px;height:52px}
.start-title{font-family:'Amiri',serif;font-size:26px;font-weight:700;color:var(--primary)}
.start-x{margin-inline-start:auto;background:none;border:none;font-size:24px;color:var(--muted)}
.start-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px}
.start-sec{font-weight:700;color:var(--primary);margin-bottom:8px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tpl-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#33504F;font-size:13px}
.tpl-card:hover{border-color:var(--primary);background:var(--primary-soft)}
.tpl-ic{font-size:26px;color:var(--primary);font-weight:700}
.start-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.start-recent{border-inline-start:1px solid var(--line);padding-inline-start:16px}
.recent-item{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;color:var(--ink)}
.recent-item:hover{border-color:var(--primary)}
@media (max-width:700px){.start-grid{grid-template-columns:1fr}.start-recent{border:none;padding:0}}
.modal .body{max-height:70vh;overflow:auto}
body.focus .titlebar,body.focus .tabs,body.focus .ribbon,body.focus .panel,body.focus .statusbar{display:none}
body.focus .workspace{grid-template-columns:minmax(0,1fr)}
body.focus .canvas{background:var(--paper)}
.focus-exit{position:fixed;top:10px;inset-inline-end:10px;z-index:5;display:none}
body.focus .focus-exit{display:block}

/* status bar */
.statusbar{background:var(--primary);color:#CFE3E1;display:flex;justify-content:space-between;align-items:center;padding:3px 12px;font-size:12px;gap:10px}
.st-btn{background:none;border:none;color:#CFE3E1;font-size:12px;padding:0}
.st-btn:hover{color:#fff;text-decoration:underline}
.app-ver{opacity:.7;direction:ltr}

/* modal */
.modal-back{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--paper);border-radius:12px;width:min(440px,92vw);overflow:hidden;box-shadow:0 10px 30px #0004}
.modal header{background:var(--primary);color:var(--paper);padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.modal header button{background:none;border:none;color:var(--paper);font-size:18px}
.modal .body{padding:14px}
.modal label{display:block;font-size:12px;color:#5B6B6A;margin:0 0 3px}
.modal input,.modal select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:10px;background:#fff}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 16px}
.btn2{background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:6px;padding:6px 14px}
.modal p{margin:0 0 10px;line-height:1.7}

.toast{position:fixed;bottom:36px;inset-inline-start:50%;transform:translateX(50%);background:#2B2B2B;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
[dir=ltr] .toast{transform:translateX(-50%)}
.toast.show{opacity:1}

@media (max-width:900px){
  .workspace{grid-template-columns:minmax(0,1fr)!important}
  .panel{display:none}
  .sheet{width:100%;min-height:60vh;padding:1.2cm}
}
@media print{
  .titlebar,.tabs,.ribbon,.panel,.statusbar,.no-print,.toast{display:none!important}
  body.pages-mode .pages-view{gap:0;display:block!important}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  .workspace{display:block!important}
  .canvas{display:block!important;padding:0!important;overflow:visible!important}
  .pv-page:last-child{break-after:auto;page-break-after:auto}
  .start-ov,#modalRoot{display:none!important}
  .pv-page{border:none;box-shadow:none;zoom:1;page-break-after:always;break-after:page}
  @page{size:auto;margin:0}
  .canvas{padding:0;overflow:visible}
  .sheet{border:none;box-shadow:none;background-image:none;zoom:1;padding:0}
  .wq-toc,.wq-bib{border:none}
  #app{height:auto}
}

</style>
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="tb-start">
      <span class="logo"><svg viewBox="0 0 100 100" width="26" height="26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="4" width="92" height="92" rx="20" fill="#0B4C52"/><rect x="24" y="20" width="44" height="58" rx="4" fill="#F4EFE6"/><rect x="31" y="32" width="30" height="3.5" rx="1.75" fill="#0F5F66" opacity=".4"/><rect x="31" y="41" width="30" height="3.5" rx="1.75" fill="#0F5F66" opacity=".4"/><rect x="31" y="50" width="20" height="3.5" rx="1.75" fill="#0F5F66" opacity=".4"/><path d="M80 16 L50 68 L46 78 L54 71 L84 19 Z" fill="#B8732E"/><path d="M46 78 L50 68 L54 71 Z" fill="#0B4C52"/></svg></span>
      <span class="app-name" data-i18n="appName"></span>
      <input id="docTitle" class="doc-title" spellcheck="false" aria-label="title">
      <span class="ext">.warraq</span>
      <span id="saveState" class="save-state"></span>
    </div>
    <div class="tb-end">
      <button id="btnSnap" class="tb-btn"></button>
      <button id="btnUiLang" class="tb-btn" title=""></button>
    </div>
  </header>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="ribbon" class="ribbon"></div>
  <main class="workspace">
    <aside id="navPanel" class="panel nav-panel">
      <h3><span class="ic">☰</span> <span data-i18n="docMap"></span></h3>
      <div id="navList" class="nav-list"></div>
    </aside>
    <section class="canvas" id="canvas">
      <div id="sheet" class="sheet">
        <div id="page" class="page" contenteditable="true" spellcheck="true"></div>
        <div id="fnZone" class="fn-zone"></div>
      </div>
      <div id="pagesView" class="pages-view"></div>
    </section>
    <aside id="refPanel" class="panel ref-panel">
      <h3><span class="ic">▤</span> <span data-i18n="references"></span></h3>
      <div id="refPanelBody"></div>
    </aside>
  </main>
  <footer class="statusbar">
    <span id="stWords"></span>
    <button id="stGoal" class="st-btn"></button>
    <span id="stLang"></span>
    <span class="app-ver no-print"></span>
  </footer>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="fileOpen" accept=".warraq,.json,application/json" hidden>
<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileDocx" accept=".docx,.doc,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<script>
/* ===== i18n: كل نصوص الواجهة هنا. لإضافة لغة: أضف مفتاحا\u064B جديدا\u064B بنفس المفاتيح ===== */

    h1: 'عنوان ١', h2: 'عنوان ٢', h3: 'عنوان ٣', normal: 'نص', quote: 'اقتباس', clear: 'مسح التنسيق',
    font: 'الخط', size: 'الحجم', color: 'لون النص', highlight: 'تظليل',
    numerals: 'الأرقام', numArabic: '١٢٣', numWestern: '123',
    table: 'جدول', image: 'صورة', pageBreak: 'فاصل صفحة', hr: 'خط فاصل', quotes: '« »', specialChar: 'رمز',

/* ===== core: الثوابت والحالة والأدوات العامة ===== */
const APP_VERSION = '0.6.1';
const APP_STAGE = '6';
const APP_UPDATED = '2026-11-18';
const FILE_FORMAT = 'warraq';
const FILE_FORMAT_VERSION = 1;
const LS_KEY = 'warraq.autosave.v1';
const LS_PREFS = 'warraq.prefs.v1';

const WQ = {
  ui: 'ar',
  doc: null,          // { meta, settings, content }
  dirty: false,       // تعديلات لم ت\u064Fحفظ في ملف
  downloads: null,    // قدرة الحفظ في المعاينة (إن وجدت)
  prefs: { ui: 'ar', dailyGoal: 1000, goalDay: '', goalDone: 0, showNav: true, showRefs: true, zoom: 100 }
};

const t = (k) => (I18N[WQ.ui] && I18N[WQ.ui][k] !== undefined) ? I18N[WQ.ui][k] : (I18N.ar[k] ?? k);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const nowISO = () => new Date().toISOString();
const todayKey = () => new Date().toISOString().slice(0, 10);

/* ---------- الأرقام ---------- */
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toArabicDigits = (s) => s.replace(/[0-9]/g, (d) => AR_DIGITS[+d]);
const toWesternDigits = (s) => s.replace(/[\u0660-\u0669]/g, (d) => String(AR_DIGITS.indexOf(d)));
/* تنسيق رقم للواجهة حسب لغة الواجهة */
const fmtNum = (n) => {
  const s = Math.round(n).toLocaleString('en-US');
  return WQ.ui === 'ar' ? toArabicDigits(s).replace(/,/g, '٬') : s;
};

/* ---------- مستند جديد ---------- */
function newDocModel(lang = 'ar') {
  return {
    meta: { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: '', author: '', created: nowISO(), modified: nowISO() },
    settings: {
      lang,                                   // ar | en | fr
      numerals: lang === 'ar' ? 'arabic' : 'western', // arabic | western
      pageSize: 'a4', margins: 'normal', lineSpacing: '15',
      citeStyle: 'notes'                      // notes | apa | vancouver
    },
    content: { html: '' },
    references: [],
    footnotes: {},
    snapshots: []
  };
}

/* ---------- أدوات صغيرة ---------- */
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

/* ===== editor: محرك التحرير (الكتابة، الاتجاه، الأرقام، الطباعة الفرنسية، اللصق) ===== */
const BLOCK_SEL = 'p,h1,h2,h3,h4,blockquote,li,td,th,div';
const PAGE_H_PX = 29.7 * 37.7953; // ارتفاع A4 بالبكسل
let page;

function initEditor() {
  page = $('#page');
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
  try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
  page.addEventListener('beforeinput', onBeforeInput);
  page.addEventListener('input', onInput);
  page.addEventListener('paste', onPaste);
  document.addEventListener('selectionchange', () => { if (page.contains(document.getSelection().anchorNode)) updateToolbarState(); });
}

/* ---------- المستند ↔ المحرر ---------- */
function loadDocIntoEditor(doc) {
  WQ.doc = doc;
  WQ._lastWords = null;
  doc.references = doc.references || [];
  doc.footnotes = doc.footnotes || {};
  doc.snapshots = doc.snapshots || [];
  page.innerHTML = doc.content.html || '<p dir="auto"><br></p>';
  normalizeBlocks();
  applyDocSettings();
  $('#docTitle').value = doc.meta.title || '';
  refreshDerived();
  if (typeof verifyAyat === 'function') verifyAyat();
}
function editorHtml() { return page.innerHTML; }

function applyDocSettings() {
  const s = WQ.doc.settings;
  const sheet = $('#sheet'), fz = $('#fnZone');
  page.dir = fz.dir = s.lang === 'ar' ? 'rtl' : 'ltr';
  page.lang = fz.lang = s.lang;
  sheet.classList.toggle('letter', s.pageSize === 'letter');
  sheet.classList.remove('m-narrow', 'm-wide');
  if (s.margins !== 'normal') sheet.classList.add('m-' + s.margins);
  page.classList.remove('ls-1', 'ls-115', 'ls-15', 'ls-2');
  page.classList.add('ls-' + s.lineSpacing);
  page.classList.toggle('num-ar', s.numerals === 'arabic' && s.lang === 'ar');
  page.dataset.placeholder = t('placeholder');
}

/* كل فقرة تأخذ اتجاهها من أول حرف قوي فيها (عربي ← يمين، لاتيني ← يسار) */
function normalizeBlocks() {

  return '<span class="ibid">' + T.ibid + '</span>' + (page ? T.c + pageStr(page, L) : '') + (L === 'ar' ? '.' : (page ? '.' : ''));
}

/* ---------- الرسم: يمر على المستند بالترتيب ويحسب كل شيء ---------- */
const refById = (id) => (WQ.doc.references || []).find((r) => r.id === id);
function fnMark(n) {
  const s = WQ.doc.settings;
  const num = s.numerals === 'arabic' ? toArabicDigits(String(n)) : String(n);
  return s.lang === 'ar' ? '(' + num + ')' : num;
}
function renderCitations() {
  if (!WQ.doc) return;
  const style = WQ.doc.settings.citeStyle || 'notes';
  const fns = WQ.doc.footnotes;
  const order = [];       // ترتيب أول ظهور للمراجع (لـ Vancouver)
  const seen = new Set();
  let lastRef = null, n = 0;
  const zone = [];
  const fnBody = WQ._fnBody = {};
  $$('.wq-fn,.wq-cite', page).forEach((el) => {
    if (el.classList.contains('wq-fn')) {
      const f = fns[el.dataset.fn];
      if (!f) { el.remove(); return; }
      n++;
      const mark = fnMark(n);
      if (el.textContent !== mark) el.textContent = mark;
      let body = '';
      const r = f.refId && refById(f.refId);
      if (r) {
        if (style === 'notes') body = (lastRef === r.id) ? noteIbid(r, f.page) : (seen.has(r.id) ? noteShort(r, f.page) : noteFull(r, f.page));
        else if (style === 'apa') body = apaInText(r, f.page);
        else { if (!order.includes(r.id)) order.push(r.id); body = '[' + N(order.indexOf(r.id) + 1, WQ.doc.settings.lang) + ']'; }
        seen.add(r.id); lastRef = r.id;
      } else if (f.refId) lastRef = null;
      if (f.text) body += (body ? ' ' : '') + E(f.text);
      if (!f.refId) lastRef = null;
      fnBody[el.dataset.fn] = body || '…';
      zone.push('<p class="fn-item" dir="auto" data-fn="' + el.dataset.fn + '"><span class="fn-num">' + mark + '</span> ' + (body || '…') + '</p>');
    } else {
      const r = refById(el.dataset.ref);
      if (!r) { el.remove(); return; }
      let txt;
      if (style === 'vancouver') { if (!order.includes(r.id)) order.push(r.id); txt = '[' + N(order.indexOf(r.id) + 1, WQ.doc.settings.lang) + ']'; }
      else txt = apaInText(r, el.dataset.page);
      const plain = new DOMParser().parseFromString(txt, 'text/html').body.textContent;
      if (el.textContent !== plain) el.textContent = plain;
      seen.add(r.id);
    }
  });
  const fz = $('#fnZone');
  const html = zone.join('');
  if (fz._h !== html) { fz.innerHTML = html; fz._h = html; }
  WQ._citedOrder = order; WQ._cited = seen;
  renderBibliography();
  renderToc();
  renderRefPanel();
}

/* ---------- قائمة المراجع ---------- */
function bibEntries() {
  const style = WQ.doc.settings.citeStyle || 'notes';
  const cited = (WQ.doc.references || []).filter((r) => WQ._cited && WQ._cited.has(r.id));
  if (style === 'vancouver') {
    return [{ items: WQ._citedOrder.map((id, i) => ({ r: refById(id), num: i + 1 })).filter((x) => x.r) }];
  }
  const key = (r) => (parseAuthors(r)[0] || { family: r.title }).family + ' ' + r.title;
  const ar = cited.filter((r) => refLang(r) === 'ar').sort((a, b) => key(a).localeCompare(key(b), 'ar'));
  const fo = cited.filter((r) => refLang(r) !== 'ar').sort((a, b) => key(a).localeCompare(key(b), 'en'));
  const docAr = WQ.doc.settings.lang === 'ar';
  const groups = docAr ? [{ title: t('bibAr'), items: ar }, { title: t('bibForeign'), items: fo }] : [{ title: t('bibForeign'), items: fo }, { title: t('bibAr'), items: ar }];
  return groups.filter((g) => g.items.length).map((g) => ({ title: (ar.length && fo.length) ? g.title : '', items: g.items.map((r) => ({ r })) }));
}
function renderBibliography() {
  const blocks = $$('.wq-bib', page);
  if (!blocks.length) return;
  const style = WQ.doc.settings.citeStyle || 'notes';
  const groups = bibEntries();
  let h = '<div class="wq-block-title">' + E(t('bibTitle')) + '</div>';
  if (!groups.length || !groups.some((g) => g.items.length)) h += '<p class="wq-note">' + E(t('bibEmpty')) + '</p>';
  groups.forEach((g) => {
    if (g.title) h += '<div class="wq-block-sub">' + E(g.title) + '</div>';
    g.items.forEach((x) => {
      const txt = style === 'vancouver' ? N(x.num, WQ.doc.settings.lang) + '. ' + vanRef(x.r) : apaRef(x.r);
      h += '<p class="bib-item" dir="auto">' + txt + '</p>';
    });
  });
  blocks.forEach((b) => { if (b._h !== h) { b.innerHTML = h; b._h = h; } });
}

/* ---------- فهرس المحتويات ---------- */
function renderToc() {
  const blocks = $$('.wq-toc', page);
  if (!blocks.length) return;
  const hs = headings();
  let h = '<div class="wq-block-title">' + E(t('tocTitle')) + '</div>';
  if (!hs.length) h += '<p class="wq-note">' + E(t('tocEmpty')) + '</p>';
  hs.forEach((x, i) => {
    h += '<div class="toc-row l' + x.tagName[1] + '" data-i="' + i + '" dir="auto"><span>' + E(x.textContent.trim()) + '</span><span class="dots"></span><span>' + N((PV.exact && PV.headPage[i] !== undefined) ? PV.headPage[i] : pageOf(x), WQ.doc.settings.lang) + '</span></div>';
  });
  if (hs.length && !PV.exact) h += '<p class="wq-note">' + E(t('pageApproxNote')) + '</p>';
  blocks.forEach((b) => { if (b._h !== h) { b.innerHTML = h; b._h = h; } });
}

/* ---------- الإدراج ---------- */
function insertInline(html) { insertHtml(html); renderCitations(); }
function addFootnote(data) {
  const id = uid('f');
  WQ.doc.footnotes[id] = { refId: data.refId || '', page: data.page || '', text: data.text || '' };
  insertInline('<sup class="wq-fn" data-fn="' + id + '" contenteditable="false">*</sup>');
  return id;
}
function addCitation(refId, pageNo) {
  if ((WQ.doc.settings.citeStyle || 'notes') === 'notes') return addFootnote({ refId, page: pageNo });
  insertInline('<span class="wq-cite" data-ref="' + refId + '" data-page="' + E(pageNo || '') + '" contenteditable="false">[*]</span>');
}
function insertBlock(cls) {
  const ex = $('.' + cls, page);
  if (ex) { ex.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  insertHtml('<div class="' + cls + '" contenteditable="false"></div><p dir="auto"><br></p>');
  renderCitations();
}

/* ---------- تغيير نمط التوثيق (مع تحويل الاستشهادات) ---------- */
function setCiteStyle(style) {
  const prev = WQ.doc.settings.citeStyle || 'notes';
  if (prev === style) return;
  takeSnapshot(t('citeStyle') + ': ' + styleName(prev) + ' → ' + styleName(style));
  WQ.doc.settings.citeStyle = style;
  if (style === 'notes') {
    $$('.wq-cite', page).forEach((el) => {
      const id = uid('f');
      WQ.doc.footnotes[id] = { refId: el.dataset.ref, page: el.dataset.page || '', text: '' };
      const s = document.createElement('sup'); s.className = 'wq-fn'; s.dataset.fn = id; s.contentEditable = 'false'; s.textContent = '*';
      el.replaceWith(s);
    });
  } else if (prev === 'notes') {
    $$('.wq-fn', page).forEach((el) => {
      const f = WQ.doc.footnotes[el.dataset.fn];
      if (f && f.refId && !f.text) {
        const s = document.createElement('span'); s.className = 'wq-cite'; s.dataset.ref = f.refId; s.dataset.page = f.page || ''; s.contentEditable = 'false'; s.textContent = '[*]';
        el.replaceWith(s); delete WQ.doc.footnotes[el.dataset.fn];
      }
    });
  }
  markDirty(); renderCitations(); renderRibbon();
}

/* ---------- لوحة المراجع ---------- */
let refQuery = '';
function citeCount(id) {
  return $$('.wq-cite', page).filter((e) => e.dataset.ref === id).length +
    $$('.wq-fn', page).filter((e) => (WQ.doc.footnotes[e.dataset.fn] || {}).refId === id).length;
}
function renderRefPanel() {
  const body = $('#refPanelBody'); if (!body) return;
  const refs = WQ.doc.references || [];
  const q = refQuery.trim().toLowerCase();
  const list = refs.filter((r) => !q || (r.authors + ' ' + r.title + ' ' + r.year).toLowerCase().includes(q));
  const head = $('#refPanel h3 [data-i18n]');
  if (head) head.textContent = t('references') + ' (' + fmtNum(refs.length) + ')';
  let h = '<input class="ref-search" id="refSearch" placeholder="' + E(t('searchRefs')) + '" value="' + E(refQuery) + '">';
  if (!refs.length) h += '<p class="soon">' + E(t('noRefs')) + '</p>';
  list.forEach((r) => {
    const a = parseAuthors(r)[0];
    const n = citeCount(r.id);
    h += '<div class="ref-card" dir="auto" data-id="' + r.id + '"><div class="ra">' + E(a ? a.family + (a.given ? (refLang(r) === 'ar' ? '، ' : ', ') + a.given : '') : r.title) + '</div>' +
      '<div class="rm">' + E(r.title.slice(0, 60)) + ' · ' + E(N(r.year, refLang(r))) + (n ? ' · ' + E(t('citedTimes')) + ' ' + fmtNum(n) : '') + '</div>' +
      '<div class="acts"><button class="c" data-act="cite">' + E(t('cite')) + '</button><button data-act="edit">' + E(t('edit')) + '</button><button data-act="del">' + E(t('del')) + '</button></div></div>';
  });
  h += '<button class="btn ref-new" id="refNew">+ ' + E(t('newRef')) + '</button>';
  const focused = document.activeElement && document.activeElement.id === 'refSearch';
  if (body._h === h) return;
  body.innerHTML = h; body._h = h;
  const sInp = $('#refSearch');
  sInp.oninput = (e) => { refQuery = e.target.value; renderRefPanel(); };
  if (focused) { sInp.focus(); sInp.setSelectionRange(sInp.value.length, sInp.value.length); }
  $('#refNew').onclick = () => { saveRange(); openRefDialog(); };
  $$('.ref-card button', body).forEach((b) => {
    b.onmousedown = (e) => { e.preventDefault(); saveRange(); };
    b.onclick = () => {
      const id = b.closest('.ref-card').dataset.id, act = b.dataset.act;
      if (act === 'cite') openCiteDialog(id);
      else if (act === 'edit') openRefDialog(refById(id));
      else deleteRef(id);
    };
  });
}
function deleteRef(id) {
  const n = citeCount(id);
  const doDel = () => {
    $$('.wq-cite', page).filter((e) => e.dataset.ref === id).forEach((e) => e.remove());
    $$('.wq-fn', page).forEach((e) => { const f = WQ.doc.footnotes[e.dataset.fn]; if (f && f.refId === id) { if (f.text) f.refId = ''; else { e.remove(); delete WQ.doc.footnotes[e.dataset.fn]; } } });
    WQ.doc.references = WQ.doc.references.filter((r) => r.id !== id);
    markDirty(); renderCitations();
  };
  if (!n) { doDel(); return; }
  showModal({ title: t('del'), body: '<p>' + E(t('refInUse').replace('{n}', fmtNum(n))) + '</p>',
    actions: [{ label: t('cancel') }, { label: t('deleteAll'), cls: 'btn', run: doDel }] });
}

/* ---------- نافذة المرجع ---------- */
function openRefDialog(existing) {
  const r = existing ? Object.assign({}, existing) : cleanRef({ id: uid('r'), type: 'book' });
  const fieldsFor = { book: ['authors', 'title', 'year', 'publisher', 'place'], article: ['authors', 'title', 'year', 'journal', 'volume', 'issue', 'pages'],
    thesis: ['authors', 'title', 'year', 'university', 'degree'], web: ['authors', 'title', 'year', 'publisher', 'url', 'accessed'] };
  const style = WQ.doc.settings.citeStyle || 'notes';
  const preview = () => style === 'vancouver' ? vanRef(r) : (style === 'apa' ? apaRef(r) : noteFull(r, ''));
  const draw = (m) => {
    const b = $('.body', m);
    let h = '<div class="chips">' + REF_TYPES.map((tp) => '<button class="chip' + (r.type === tp ? ' on' : '') + '" data-tp="' + tp + '">' + E(t('rt_' + tp)) + '</button>').join('') + '</div>';
    fieldsFor[r.type].forEach((f) => {
      const v = E(r[f] || '');
      if (f === 'authors') h += '<label>' + E(t('f_authors')) + '</label><textarea data-f="authors" dir="auto" rows="2">' + v + '</textarea>';
      else if (f === 'degree') h += '<label>' + E(t('f_degree')) + '</label><select data-f="degree"><option value="master">' + E(t('degMaster')) + '</option><option value="phd"' + (r.degree === 'phd' ? ' selected' : '') + '>' + E(t('degPhd')) + '</option></select>';
      else h += '<label>' + E(t('f_' + f)) + '</label><input data-f="' + f + '" dir="' + (/url|year|volume|issue|pages|accessed/.test(f) ? 'ltr' : 'auto') + '" value="' + v + '">';
    });
    h += '<label>' + E(t('f_lang')) + '</label><select data-f="lang"><option value="">' + E(t('auto')) + '</option><option value="ar">' + E(t('langAr')) + '</option><option value="en">' + E(t('langEn')) + '</option><option value="fr">' + E(t('langFr')) + '</option></select>';
    h += '<label>' + E(t('preview')) + ' (' + E(styleName(style)) + ')</label><div class="preview-box" dir="auto" id="refPrev">' + preview() + '</div>';
    b.innerHTML = h;
    $('[data-f="lang"]', b).value = r.lang || '';
    $$('.chip', b).forEach((c) => c.onclick = () => { r.type = c.dataset.tp; draw(m); });
    $$('[data-f]', b).forEach((inp) => inp.addEventListener('input', () => { r[inp.dataset.f] = inp.value; $('#refPrev', b).innerHTML = preview(); }));
    $$('select[data-f]', b).forEach((inp) => inp.addEventListener('change', () => { r[inp.dataset.f] = inp.value; $('#refPrev', b).innerHTML = preview(); }));
  };
  const commit = (m, andInsert) => {
    if (!r.title.trim()) { const p = $('#refPrev', m); p.innerHTML = '<span style="color:#A32D2D">' + E(t('needTitle')) + '</span>'; return false; }
    const clean = cleanRef(r);
    const i = WQ.doc.references.findIndex((x) => x.id === clean.id);
    if (i >= 0) WQ.doc.references[i] = clean; else WQ.doc.references.push(clean);
    markDirty(); renderCitations();
    if (andInsert) setTimeout(() => openCiteDialog(clean.id), 50);
  };
  const actions = [{ label: t('cancel') }];
  if (!existing) actions.push({ label: t('saveOnly'), run: (m) => commit(m, false) });
  actions.push({ label: existing ? t('ok') : t('saveInsert'), cls: 'btn', run: (m) => commit(m, !existing) });
  showModal({ title: existing ? t('editRef') : t('newRef'), body: '', wide: true, actions, onOpen: draw });
}
function styleName(s) { return s === 'apa' ? 'APA' : (s === 'vancouver' ? 'Vancouver' : t('styleNotes')); }

/* ===== quran: إدراج الآيات من نص مشروع Tanzil (الرسم العثماني) بدون أي تعديل للنص ===== */
let QURAN = null, QURAN_IDX = null, _qLoading = null;

function quranCredits() {
  return '<p class="wq-note" style="line-height:1.8">' + E(t('quranCredit')) +
    ' <a href="https://tanzil.net" target="_blank" rel="noopener">tanzil.net</a></p>';
}
async function loadQuran() {
  if (QURAN) return QURAN;
  if (!_qLoading) _qLoading = fetch('quran.json').then((r) => { if (!r.ok) throw new Error('http'); return r.json(); }).then((q) => {
    // نص Tanzil يضع البسملة في بداية الآية الأولى من كل سورة (عدا الفاتحة والتوبة)،
    // والبسملة ليست من الآية؛ فنفصلها عند العرض والإدراج، ويبقى باقي النص كما هو حرفياً
    const basmala = q.text[0][0] + ' ';
    q.view = q.text.map((sura, i) => sura.map((a, j) => (i > 0 && j === 0 && a.startsWith(basmala)) ? a.slice(basmala.length) : a));
    QURAN = q;
    QURAN_IDX = q.view.map((sura) => sura.map(normAr));
    return q;
  }).catch((e) => { _qLoading = null; throw e; });
  return _qLoading;
}
/* تطبيع للبحث فقط (النص الم\u064Fدرج يبقى الأصل حرفيا\u064B): نحذف التشكيل وعلامات الوقف ونوح\u0651د الألف والياء */
function normAr(s) {
  return String(s)
    .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
    .replace(/[\u0671\u0622\u0623\u0625]/g, 'ا')
    .replace(/[\u0649]/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim();
}
function searchQuran(q, max = 30) {
  const n = normAr(q); if (n.length < 2) return [];
  const out = [];
  for (let s = 0; s < QURAN_IDX.length && out.length < max; s++)
    for (let a = 0; a < QURAN_IDX[s].length && out.length < max; a++)
      if (QURAN_IDX[s][a].includes(n)) out.push([s + 1, a + 1]);
  return out;
}
const ayahText = (s, a, b) => QURAN.view[s - 1].slice(a - 1, b).join(' ');
function suraLabel(s) { const x = QURAN.suras[s - 1]; return WQ.doc.settings.lang === 'ar' ? x.name : x.tname; }
function ayahRef(s, a, b) {
  const ar = WQ.doc.settings.lang === 'ar';
  const num = (v) => ar ? toArabicDigits(String(v)) : String(v);
  const range = a === b ? num(a) : num(a) + '-' + num(b);
  return ar ? suraLabel(s) + ': ' + range : suraLabel(s) + ' ' + s + ':' + (a === b ? a : a + '-' + b);
}
function ayahFootText(s, a, b) {
  const ar = WQ.doc.settings.lang === 'ar';
  if (ar) return 'سورة ' + suraLabel(s) + '، ' + (a === b ? 'الآية ' + toArabicDigits(String(a)) : 'الآيات ' + toArabicDigits(a + '-' + b)) + '.';
  return "Qur'an, " + suraLabel(s) + ' ' + s + ':' + (a === b ? a : a + '-' + b) + '.';
}
function ayahSpan(s, a, b) {
  return '<span class="wq-ayah" data-s="' + s + '" data-a="' + a + '" data-b="' + b + '" contenteditable="false" dir="rtl" lang="ar">﴿' + E(ayahText(s, a, b)) + '﴾</span>';
}
function insertAyah(s, a, b, opt) {
  let html = ayahSpan(s, a, b);
  if (opt.where === 'text') html += ' <span class="wq-ayah-ref" contenteditable="false">[' + E(ayahRef(s, a, b)) + ']</span>';
  if (opt.block) {
    insertHtml('<p dir="rtl" style="text-align: center">' + html + '</p><p dir="auto"><br></p>');
  } else insertHtml(html + '&nbsp;');
  if (opt.where === 'note') {
    // نضع مؤشر الحاشية بعد الآية مباشرة
    const spans = $$('.wq-ayah', page); const last = spans.filter((x) => +x.dataset.s === s && +x.dataset.a === a).pop();

    WQ.doc.footnotes[id] = { refId: '', page: '', text: ayahFootText(s, a, b) };

  }

}

/* عند فتح ملف: نعيد كتابة نص الآيات من المصدر لضمان مطابقته للأصل حرفيا\u064B */
async function verifyAyat() {
  const spans = $$('.wq-ayah', page); if (!spans.length) return;
  try { await loadQuran(); } catch (e) { return; }
  spans.forEach((sp) => {
    const s = +sp.dataset.s, a = +sp.dataset.a, b = +sp.dataset.b;
    if (!(s >= 1 && s <= 114) || !(a >= 1) || !(b >= a) || b > QURAN.suras[s - 1].ayas) { sp.classList.add('ayah-bad'); return; }

    if (sp.textContent !== want) sp.textContent = want;
  });
}

/* ===== doc97: قراءة ملفات Word القديمة (.doc 97-2003) مباشرة، بدون مكتبات =====
   يقرأ النص والفقرات والجداول والحواشي. التنسيق (العريض والأحجام) غير مقروء في هذا الإصدار،
   والعناوين تُكتشف من شكل السطر (الترقيم 2.1 وكلمات مثل الفصل/Chapter). */

function cfbRead(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  if (dv.getUint32(0, true) !== 0xE011CFD0) throw new Error('not cfb');
  const secSize = 1 << dv.getUint16(0x1E, true), miniSize = 1 << dv.getUint16(0x20, true);
  const nFat = dv.getUint32(0x2C, true), dirStart = dv.getUint32(0x30, true), miniCutoff = dv.getUint32(0x38, true);
  const miniFatStart = dv.getUint32(0x3C, true), difatStart = dv.getUint32(0x44, true);
  const secOff = (s) => (s + 1) * secSize;
  // DIFAT ← قائمة قطاعات FAT
  const fatSecs = [];
  for (let i = 0; i < 109 && fatSecs.length < nFat; i++) { const s = dv.getUint32(0x4C + i * 4, true); if (s < 0xFFFFFFFA) fatSecs.push(s); }
  let d = difatStart, guard = 0;
  while (d < 0xFFFFFFFA && fatSecs.length < nFat && guard++ < 10000) {
    const per = secSize / 4 - 1;
    for (let i = 0; i < per && fatSecs.length < nFat; i++) { const s = dv.getUint32(secOff(d) + i * 4, true); if (s < 0xFFFFFFFA) fatSecs.push(s); }
    d = dv.getUint32(secOff(d) + per * 4, true);
  }
  const fat = new Uint32Array(fatSecs.length * secSize / 4);
  fatSecs.forEach((s, i) => { for (let j = 0; j < secSize / 4; j++) fat[i * secSize / 4 + j] = dv.getUint32(secOff(s) + j * 4, true); });
  const chain = (start) => { const out = []; let s = start, g = 0; while (s < 0xFFFFFFFA && g++ < 1e6) { out.push(s); s = fat[s]; } return out; };
  const readChain = (start, size) => {
    const secs = chain(start), out = new Uint8Array(secs.length * secSize);
    secs.forEach((s, i) => out.set(u8.subarray(secOff(s), secOff(s) + secSize), i * secSize));
    return size !== undefined ? out.subarray(0, size) : out;
  };
  // الدليل
  const dirBytes = readChain(dirStart), ddv = new DataView(dirBytes.buffer);
  const entries = [];
  for (let o = 0; o + 128 <= dirBytes.length; o += 128) {
    const nl = ddv.getUint16(o + 64, true); if (!nl) { entries.push(null); continue; }
    let name = ''; for (let i = 0; i < nl / 2 - 1; i++) name += String.fromCharCode(ddv.getUint16(o + i * 2, true));
    entries.push({ name, type: dirBytes[o + 66], start: ddv.getUint32(o + 116, true), size: ddv.getUint32(o + 120, true) });
  }
  const root = entries[0];
  const miniStream = root ? readChain(root.start, root.size) : new Uint8Array(0);
  const miniFat = miniFatStart < 0xFFFFFFFA ? (() => { const b = readChain(miniFatStart); const v = new DataView(b.buffer); const a = new Uint32Array(b.length / 4); for (let i = 0; i < a.length; i++) a[i] = v.getUint32(i * 4, true); return a; })() : new Uint32Array(0);
  const stream = (name) => {
    const e = entries.find((x) => x && x.type === 2 && x.name === name); if (!e) return null;
    if (e.size >= miniCutoff) return readChain(e.start, e.size);
    const out = new Uint8Array(e.size); let s = e.start, o = 0, g = 0;
    while (s < 0xFFFFFFFA && o < e.size && g++ < 1e6) { const n = Math.min(miniSize, e.size - o); out.set(miniStream.subarray(s * miniSize, s * miniSize + n), o); o += n; s = miniFat[s]; }
    return out;
  };
  return { stream };
}

function doc97Text(buf) {
  const cfb = cfbRead(buf);
  const wd = cfb.stream('WordDocument'); if (!wd) throw new Error('no WordDocument');
  const w = new DataView(wd.buffer, wd.byteOffset, wd.byteLength);
  if (w.getUint16(0, true) !== 0xA5EC) throw new Error('not word');
  const flags = w.getUint16(0x0A, true);
  if (flags & 0x0100) throw new Error('encrypted');
  const table = cfb.stream((flags & 0x0200) ? '1Table' : '0Table'); if (!table) throw new Error('no table');
  const t = new DataView(table.buffer, table.byteOffset, table.byteLength);
  // FibRgLw97: ccpText ثم ccpFtn
  const csw = w.getUint16(32, true), lwOff = 34 + csw * 2 + 2;
  const ccpText = w.getInt32(lwOff + 12, true), ccpFtn = w.getInt32(lwOff + 16, true);
  const cbRgLw = w.getUint16(lwOff - 2, true) * 4, fcOff = lwOff + cbRgLw + 2;
  // FibRgFcLcb97: fcClx هو الزوج رقم 33
  const fcClx = w.getUint32(fcOff + 33 * 8, true), lcbClx = w.getUint32(fcOff + 33 * 8 + 4, true);
  let p = fcClx; const end = fcClx + lcbClx;
  while (p < end && table[p] === 0x01) { p += 3 + t.getUint16(p + 1, true); }
  if (table[p] !== 0x02) throw new Error('clx');
  const lcb = t.getUint32(p + 1, true); p += 5;
  const n = (lcb - 4) / 12;
  const cps = []; for (let i = 0; i <= n; i++) cps.push(t.getUint32(p + i * 4, true));
  const pcdBase = p + (n + 1) * 4;
  const dec1252 = new TextDecoder('windows-1252'), dec16 = new TextDecoder('utf-16le');
  let text = '';
  for (let i = 0; i < n; i++) {
    const fcRaw = t.getUint32(pcdBase + i * 8 + 2, true), len = cps[i + 1] - cps[i];
    if (fcRaw & 0x40000000) { const fc = (fcRaw & 0x3FFFFFFF) / 2; text += dec1252.decode(wd.subarray(fc, fc + len)); }
    else text += dec16.decode(wd.subarray(fcRaw, fcRaw + len * 2));
  }
  return { main: text.slice(0, ccpText), ftn: text.slice(ccpText, ccpText + Math.max(0, ccpFtn)) };
}

/* النص ← فقرات ورّاق */
function cleanFields(s) {
  // الحقول: \x13 تعليمات \x14 نتيجة \x15 ← نحتفظ بالنتيجة فقط
  let out = '', depth = 0, mode = [];
  for (const ch of s) {
    if (ch === '\x13') { depth++; mode.push('instr'); continue; }
    if (ch === '\x14') { if (mode.length) mode[mode.length - 1] = 'res'; continue; }
    if (ch === '\x15') { depth = Math.max(0, depth - 1); mode.pop(); continue; }
    if (mode.length && mode[mode.length - 1] === 'instr') continue;
    out += ch;
  }
  return out;
}
function doc97ToWarraq(buf) {
  const { main, ftn } = doc97Text(buf);
  // نصوص الحواشي: كل حاشية تبدأ بالعلامة \x02
  const fnTexts = cleanFields(ftn).split('\x02').slice(1).map((x) => x.replace(/[\r\x07\x0B\x0C\x01\x08]+/g, ' ').trim());
  const footnotes = {};
  let fnIdx = 0;
  const inline = (s) => {
    let h = '';
    for (const ch of s) {
      if (ch === '\x02') { const id = uid('f'); footnotes[id] = { refId: '', page: '', text: fnTexts[fnIdx++] || '' }; h += '<sup class="wq-fn" data-fn="' + id + '" contenteditable="false">*</sup>'; }
      else if (ch === '\x0B') h += '<br>';
      else if (ch === '\x01' || ch === '\x08' || ch === '\x05' || ch < ' ' && ch !== '\t') { /* صورة/كائن/رمز تحكم */ }
      else if (ch === '\t') h += ' ';
      else h += E(ch);
    }
    return h.replace(/^\s+|\s+$/g, '');
  };
  const body = cleanFields(main).replace(/\x0C/g, '\r\x0C\r');
  // نقسم النص لمقاطع تنتهي بـ \r (فقرة) أو \x07 (خلية جدول)
  const segs = []; let cur = '';
  for (const ch of body) { if (ch === '\r' || ch === '\x07') { segs.push({ t: cur, end: ch }); cur = ''; } else cur += ch; }
  if (cur) segs.push({ t: cur, end: '\r' });
  const items = [];
  for (let i = 0; i < segs.length; i++) {
    const sg = segs[i];
    if (sg.t === '\x0C') { items.push({ kind: 'break' }); continue; }
    if (sg.end === '\r' && !(segs[i + 1] && segs[i + 1].end === '\x07')) { items.push({ kind: 'p', raw: sg.t }); continue; }
    // منطقة جدول: خلايا (والفقرات داخل الخلية تُدمج معها)
    const cells = []; let acc = [];
    while (i < segs.length) {
      const x = segs[i];
      if (x.end === '\x07') {
        acc.push(x.t);
        // أول خلية: الفقرات اللي قبلها غالباً عنوان فوق الجدول، مش جزء من الخلية
        if (!cells.length && acc.length > 1) { acc.slice(0, -1).forEach((t0) => items.push({ kind: 'p', raw: t0 })); acc = acc.slice(-1); }
        cells.push(acc.join('\n')); acc = []; i++; continue;
      }
      if (segs[i + 1] && segs[i + 1].end === '\x07') { acc.push(x.t); i++; continue; }
      break;
    }
    i--;
    // عدد الأعمدة من الصف الأول (حتى أول علامة نهاية صف = خلية فارغة)
    const firstEnd = cells.indexOf('');
    const ncol = firstEnd > 0 ? firstEnd : cells.length;
    const rows = [];
    for (let k = 0; k < cells.length;) {
      const row = cells.slice(k, k + ncol); if (!row.length) break;
      rows.push(row); k += ncol;
      if (cells[k] === '') k++; // علامة نهاية الصف
    }
    items.push({ kind: 'tbl', rows: rows.filter((r) => r.some((c) => c.trim())) });
  }
  // العناوين من شكل السطر + تنظيف الفراغات
  let html = '', lastEmpty = true, detected = 0;
  items.forEach((it) => {
    if (it.kind === 'break') { if (!lastEmpty) { html += '<hr class="wq-pagebreak">'; lastEmpty = true; } return; }
    if (it.kind === 'tbl') {
      html += '<table><tbody>' + it.rows.map((r, ri) => '<tr>' + r.map((c) => '<td dir="auto">' + (c.split('\n').map(inline).filter(Boolean).join('<br>') || '<br>') + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      lastEmpty = false; return;
    }
    const h = inline(it.raw), plain = h.replace(/<[^>]+>/g, '').trim();
    if (!plain && !/wq-fn/.test(h)) { if (!lastEmpty) { html += '<p dir="auto"><br></p>'; lastEmpty = true; } return; }
    const m = plain.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?[.)]?\s+\S/);
    let lvl = 0;
    if (plain.length <= 90 && !/[.!؟?،,;]$/.test(plain)) {
      if (m && m[3]) lvl = 3; else if (m && m[2]) lvl = 2;
      else if (/^(الفصل|الباب|المبحث|chapter|introduction|review of literature|summary|conclusion|references|abstract|المقدمة|الخاتمة|الملخص|المراجع|قائمة)/i.test(plain) && plain.length <= 60) lvl = /^(المبحث)/.test(plain) ? 2 : 1;
    }
    if (lvl) { html += '<h' + lvl + ' dir="auto">' + h + '</h' + lvl + '>'; detected++; }
    else html += '<p dir="auto">' + h + '</p>';
    lastEmpty = false;
  });
  html = html.replace(/(<p dir="auto"><br><\/p>|<hr class="wq-pagebreak">)+$/, '');
  return { html, footnotes, detected, fromDoc: true };
}

/* ===== extras: اللقطات، وشاشة البداية، والقوالب، والاستيراد من Word ===== */
const LS_RECENT = 'warraq.recent.v1';
const SNAP_MAX = 30;
const SNAP_AUTO_MIN = 10; // دقائق بين اللقطات التلقائية

/* ======================= اللقطات ======================= */
const clone = (o) => JSON.parse(JSON.stringify(o || null));
function takeSnapshot(label, auto = false) {
  const d = WQ.doc; if (!d) return null;
  d.snapshots = d.snapshots || [];
  const html = editorHtml();
  const last = d.snapshots[d.snapshots.length - 1];
  if (auto && last && last.html === html) return null;
  const snap = { id: uid('s'), at: nowISO(), label: label || '', auto, title: $('#docTitle').value.trim(), words: countWords().words,
    html, footnotes: clone(d.footnotes), references: clone(d.references), settings: clone(d.settings) };
  d.snapshots.push(snap);
  while (d.snapshots.length > SNAP_MAX) {
    const i = d.snapshots.findIndex((s) => s.auto);
    d.snapshots.splice(i >= 0 ? i : 0, 1);
  }
  return snap;
}
function maybeAutoSnapshot() {
  const d = WQ.doc; if (!d) return;
  const last = (d.snapshots || []).slice(-1)[0];
  if (!last || (Date.now() - Date.parse(last.at)) > SNAP_AUTO_MIN * 60000) takeSnapshot('', true);
}
function restoreSnapshot(id) {
  const d = WQ.doc, s = (d.snapshots || []).find((x) => x.id === id); if (!s) return;
  takeSnapshot(t('beforeRestore'));
  d.content.html = s.html; d.footnotes = clone(s.footnotes) || {}; d.references = clone(s.references) || []; d.settings = Object.assign(d.settings, clone(s.settings));
  if (s.title) d.meta.title = s.title;
  loadDocIntoEditor(d); markDirty(); renderRibbon();
  toast(t('restoredSnap'));
}
function fmtTime(iso) {
  const dt = new Date(iso);
  const s = dt.toLocaleString(WQ.ui === 'ar' ? 'ar-EG' : 'en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  return WQ.ui === 'ar' ? s : toWesternDigits(s);
}
function openSnapshotsDialog() {
  const draw = (m) => {
    const list = (WQ.doc.snapshots || []).slice().reverse();
    let h = '<div class="row" style="grid-template-columns:1fr auto;align-items:end"><div><label>' + E(t('snapLabel')) + '</label><input id="snapName" dir="auto" placeholder="' + E(t('snapLabelPh')) + '"></div>' +
      '<button class="btn" id="snapTake" style="margin-bottom:10px">' + E(t('takeSnap')) + '</button></div>';
    if (!list.length) h += '<p class="soon">' + E(t('noSnaps')) + '</p>';
    list.forEach((s) => {
      h += '<div class="ref-card snap-row"><div class="ra">' + E(s.label || t('autoSnap')) + '</div><div class="rm">' + E(fmtTime(s.at)) + ' · ' + fmtNum(s.words) + ' ' + E(t('words')) + '</div>' +
        '<div class="acts"><button class="c" data-r="' + s.id + '">' + E(t('restore')) + '</button><button data-d="' + s.id + '">' + E(t('del')) + '</button></div></div>';
    });
    h += '<p class="wq-note">' + E(t('snapNote')) + '</p>';
    $('.body', m).innerHTML = h;
    $('#snapTake', m).onclick = () => { takeSnapshot($('#snapName', m).value.trim() || t('manualSnap')); markDirty(); draw(m); toast(t('snapTaken')); };
    $$('[data-r]', m).forEach((b) => b.onclick = () => { restoreSnapshot(b.dataset.r); $('#modalRoot').innerHTML = ''; });
    $$('[data-d]', m).forEach((b) => b.onclick = () => { WQ.doc.snapshots = WQ.doc.snapshots.filter((x) => x.id !== b.dataset.d); markDirty(); draw(m); });
  };
  showModal({ title: t('snapshots'), body: '', wide: true, actions: [{ label: t('close') }], onOpen: draw });
}

/* ======================= الملفات الأخيرة (نسخ محلية) ======================= */
function updateRecent(fileJson) {
  const d = WQ.doc; if (!d || !d.meta.id) return;
  if (!(page.innerText || '').trim()) return;
  if (fileJson.length > 1500000) return;
  let list = lsGet(LS_RECENT) || [];
  list = list.filter((x) => x.id !== d.meta.id);
  list.unshift({ id: d.meta.id, title: $('#docTitle').value.trim(), at: nowISO(), file: fileJson });
  list = list.slice(0, 5);
  while (list.length && !lsSet(LS_RECENT, list)) list.pop();
}

/* ======================= القوالب ======================= */
const PB = '<hr class="wq-pagebreak">';
const P = (s, style) => '<p dir="auto"' + (style ? ' style="' + style + '"' : '') + '>' + s + '</p>';
const C = (s, size) => P(s, 'text-align: center' + (size ? '; font-size: ' + size : ''));
function titlePage(lang, degree) {

async function unzip(buf) {

  const dec = new TextDecoder();

    if (dv.getUint32(p, true) !== 0x02014b50) break;

    files[name] = { method, csize, loff };
    p += 46 + nlen + xlen + clen;
  }
  const read = async (name) => {
    const f = files[name]; if (!f) return null;
    const lp = f.loff, start = lp + 30 + dv.getUint16(lp + 26, true) + dv.getUint16(lp + 28, true);
    const data = u8.slice(start, start + f.csize);
    if (f.method === 0) return data;
    const ds = new DecompressionStream('deflate-raw');
    const out = await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(out);
  };

  document.body.classList.add('pages-mode'); // القياس يحتاج العرض ظاهرا\u064B

  document.documentElement.style.setProperty('--zoom', 1);
  const hs = headings(); hs.forEach((h, i) => { h.dataset.hid = String(i); });
  const queue = Array.from(page.children).map((b, i) => { const c = b.cloneNode(true); c.dataset.bi = String(i); return c; });
  $$('[contenteditable]', host).forEach((x) => x.removeAttribute('contenteditable'));
  const pages = [];

  const newPage = () => {
    if (P) fnCount += WQ.doc.settings.fnRestart ? 0 : $$('.wq-fn', P.body).length;
    P = makePage(g, pages.length + 1); host.append(P.pg); pages.push(P);

    const b = queue.shift();

    if (b.tagName === 'HR' && b.classList.contains('wq-pagebreak')) { if (P.body.childElementCount) newPage(); continue; }
    if (P.body.childElementCount === 0 && b.tagName === 'P' && !b.textContent.trim() && !b.querySelector('img')) continue; // لا نبدأ صفحة بسطر فاضي
    P.body.append(b); fillFootnotes(P, fnCount);
    if (fits(P, g)) {

      if (/^H[1-3]$/.test(b.tagName) && P.body.childElementCount > 1) {
        const room = g.ch - P.body.offsetHeight - (P.fns.childElementCount ? P.fns.offsetHeight + 12 : 0);
        if (room < 70) { b.remove(); fillFootnotes(P, fnCount); newPage(); P.body.append(b); fillFootnotes(P, fnCount); }
      }

    }
    b.remove(); fillFootnotes(P, fnCount);

      if (parts[1]) queue.unshift(parts[1]);

    }
    // العنصر لا ينقسم ولا يتسع: ننقله للصفحة التالية (ومعه العنوان الذي قبله)
    const prev = P.body.lastElementChild;

    fillFootnotes(p, fnCount); if (!s.fnRestart) fnCount += $$('.wq-fn', p.body).length;
    const n = i + 1;

  if (!wasMode || PV.stale) { document.body.classList.add('pages-mode'); paginate(); }

/* ===== pptx: تحويل الرسالة إلى عرض المناقشة (PowerPoint) ===== */
let _pptxLib = null;
function loadPptxLib() {
  if (window.PptxGenJS) return Promise.resolve(window.PptxGenJS);
  if (_pptxLib) return _pptxLib;
  _pptxLib = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'vendor/pptxgen.bundle.js';
    sc.onload = () => window.PptxGenJS ? res(window.PptxGenJS) : rej(new Error('lib'));
    sc.onerror = () => { _pptxLib = null; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return _pptxLib;
}
const FRONT = /^(الإقرار|الإهداء|الشكر|المستخلص|الملخص|فهرس|قائمة المراجع|المراجع|الملاحق|declaration|acknowledg|abstract|contents|table of contents|references|appendi)/i;
const isPlaceholder = (s) => /^\s*\[[^\]]*\]\s*$/.test(s);
function firstSentence(s, max = 150) {
  s = s.replace(/\s+/g, ' ').trim();
  const m = s.match(/^(.+?[.!؟?])(\s|$)/);
  let out = m && m[1].length > 25 ? m[1] : s;
  if (out.length > max) out = out.slice(0, max).replace(/\s+\S*$/, '') + '…';
  return out;
}
/* نقرأ هيكل الرسالة: الفصول ← المباحث ← الفقرات والجداول والصور */
function outline() {
  const secs = []; let H1 = null, H2 = null;
  const front = [];
  let firstBreak = false;
  Array.from(page.children).forEach((e) => {
    if (e.tagName === 'HR' && e.classList.contains('wq-pagebreak')) { firstBreak = true; return; }
    if (!firstBreak && !H1 && e.tagName === 'P' && e.textContent.trim()) { front.push(e.innerText.trim()); }
    if (e.classList.contains('wq-toc') || e.classList.contains('wq-bib')) return;
    if (e.tagName === 'H1') { H1 = { title: e.textContent.trim(), subs: [], front: FRONT.test(e.textContent.trim()) }; secs.push(H1); H2 = null; return; }
    if (!H1) return;
    if (e.tagName === 'H2' || e.tagName === 'H3') { if (e.tagName === 'H2' || !H2) { H2 = { title: e.textContent.trim(), paras: [], tables: [], imgs: [] }; H1.subs.push(H2); } else H2.paras.push(e.textContent.trim()); return; }
    if (!H2) { H2 = { title: H1.title, paras: [], tables: [], imgs: [], self: true }; H1.subs.push(H2); }
    if (e.tagName === 'TABLE') H2.tables.push(Array.from(e.querySelectorAll('tr')).slice(0, 8).map((r) => Array.from(r.children).slice(0, 6).map((c) => ({ t: c.innerText.trim(), h: c.tagName === 'TH' }))));
    $$('img', e).forEach((im) => H2.imgs.push(im.src));
    if (/^(P|LI|BLOCKQUOTE|UL|OL)$/.test(e.tagName)) {
      if (e.tagName === 'UL' || e.tagName === 'OL') $$('li', e).forEach((li) => { const tx = li.innerText.trim(); if (tx) H2.paras.push(tx); });
      else { const tx = e.innerText.replace(/\(\S{1,4}\)/g, '').trim(); if (tx && !isPlaceholder(tx)) H2.paras.push(tx); }
    }
  });
  return { secs, front };
}

/* ===== desktop: تشغيل ورّاق كبرنامج على الكمبيوتر (يُفعَّل فقط داخل نسخة الكمبيوتر) ===== */
function initDesktop() {
  const D = window.warraqDesktop;
  if (!D || !D.isDesktop) return;
  WQ.desktop = D; WQ.filePath = null;
  document.body.classList.add('desktop');
  const enc = new TextEncoder(), dec = new TextDecoder('utf-8');
  const updateTitle = () => {
    const name = WQ.filePath ? WQ.filePath.split(/[\\/]/).pop() : (($('#docTitle').value || t('untitled')) + '.warraq');
    D.setTitle(t('appName') + ' — ' + '\u2068' + name + '\u2069' + (WQ.dirty ? ' •' : ''));
  };
  // الحفظ في نفس الملف (Ctrl+S) أو "حفظ باسم"
  saveFile = async function (asNew) {
    const bytes = enc.encode(serializeDoc());
    let p = WQ.filePath;
    if (!p || asNew === true) p = await D.saveAs(safeFileName(), 'warraq', bytes);
    else await D.write(p, bytes);
    if (!p) { toast(t('saveDeclined')); return false; }
    WQ.filePath = p; afterSave(); D.setDirty(false); updateTitle();
    return true;
  };
  window.__wqDesktopSave = () => saveFile(false);
  const md = markDirty;
  markDirty = function () { md(); D.setDirty(true); updateTitle(); };
  // الفتح من نافذة النظام (ورّاق وWord)
  const openDesktopFile = async (f) => {
    closeStart();
    if (/\.(docx?|DOCX?)$/.test(f.name)) { WQ.filePath = null; await importWordBytes(f.name, f.data.buffer.slice(f.data.byteOffset, f.data.byteOffset + f.data.byteLength)); updateTitle(); return; }
    const doc = parseDoc(dec.decode(f.data));
    if (!doc) { toast(t('openErr')); return; }
    loadDocIntoEditor(doc);
    WQ.filePath = /\.warraq$/i.test(f.path) ? f.path : null;
    WQ.dirty = false; setSaveState('saved'); autosave(); renderRibbon(); D.setDirty(false); updateTitle();
    toast(t('openOk'));
  };
  openFilePicker = async function () { const f = await D.open(); if (f) await openDesktopFile(f); };
  openDocxPicker = openFilePicker;
  const nd = newDocument;
  newDocument = function (force) { if (force || !WQ.dirty) WQ.filePath = null; nd(force); };
  const at = applyTemplate;
  applyTemplate = function (k) { WQ.filePath = null; at(k); updateTitle(); };
  // حفظ أي ملف مُصدَّر عبر نافذة الحفظ
  saveBlob = async function (base, ext, blob) {
    const p = await D.saveAs(base, ext, new Uint8Array(await blob.arrayBuffer()));
    if (!p) { toast(t('saveDeclined')); return false; }
    return true;
  };
  // تجهيز الصفحات للطباعة الحقيقية
  const preparePrint = async () => {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const was = document.body.classList.contains('pages-mode');
    document.body.classList.add('pages-mode');
    paginate();
    const letter = WQ.doc.settings.pageSize === 'letter';
    let st = $('#wqPrintSize');
    if (!st) { st = document.createElement('style'); st.id = 'wqPrintSize'; document.head.appendChild(st); }
    st.textContent = '@media print{@page{size:' + (letter ? 'letter' : 'A4') + ';margin:0}.pv-page{width:' + (letter ? '8.5in' : '210mm') + '!important;height:' + (letter ? '11in' : '297mm') + '!important}}';
    const zoomWas = getComputedStyle(document.documentElement).getPropertyValue('--zoom');
    document.documentElement.style.setProperty('--zoom', 1);
    return () => { document.documentElement.style.setProperty('--zoom', zoomWas || 1); if (!was) document.body.classList.remove('pages-mode'); };
  };
  // PDF نصّي حقيقي (الكلام يتحدد ويتنسخ)
  exportPDF = async function () {
    toast(t('exporting'));
    const restore = await preparePrint();
    let bytes;
    try { bytes = await D.pdf(WQ.doc.settings.pageSize === 'letter' ? 'Letter' : 'A4'); } finally { restore(); }
    const blob = new Blob([bytes], { type: 'application/pdf' });
    WQ._lastPdf = blob;
    if (await saveBlob(safeFileName(), 'pdf', blob)) toast(t('exportedPdf'));
    return blob;
  };
  doPrint = async function () { const restore = await preparePrint(); try { await D.print(); } finally { restore(); } };
  // ملف مفتوح بالدبل كليك أو من سطر الأوامر
  D.onOpenFile((f) => openDesktopFile(f));
  D.pending().then((f) => { if (f) openDesktopFile(f); else updateTitle(); });
  $('#docTitle').addEventListener('input', updateTitle);
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); e.stopImmediatePropagation(); saveFile(true); }
  }, true);
}

/* ===== fileio: صيغة ملف \u200E.warraq\u200E والحفظ والفتح والحفظ التلقائي ===== */

/* بنية الملف (الإصدار 1): JSON بهذه الحقول.
   في نسخة الكمبيوتر سيصبح الملف حزمة مضغوطة بنفس البنية + الصور والقطات كملفات منفصلة. */
function serializeDoc() {
  const d = WQ.doc;
  d.content.html = editorHtml();
  d.meta.id = d.meta.id || ('d' + Date.now().toString(36));
  d.meta.title = $('#docTitle').value.trim();
  d.meta.modified = nowISO();
  return JSON.stringify({
    format: FILE_FORMAT,
    formatVersion: FILE_FORMAT_VERSION,
    app: { name: 'Warraq', version: APP_VERSION },
    meta: d.meta,
    settings: d.settings,
    content: d.content,
    references: d.references || [],
    footnotes: d.footnotes || {},
    snapshots: d.snapshots || []
  });
}

function parseDoc(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { return null; }
  if (!o || o.format !== FILE_FORMAT || typeof o.formatVersion !== 'number' || !o.content) return null;
  const base = newDocModel(o.settings && o.settings.lang || 'ar');
  return {
    meta: Object.assign(base.meta, o.meta || {}),
    settings: Object.assign(base.settings, o.settings || {}),
    content: { html: sanitizeHtml(String(o.content.html || ''), true) },
    references: Array.isArray(o.references) ? o.references.filter((r) => r && ID_RE.test(r.id || '')).map(cleanRef) : [],
    footnotes: cleanFootnotes(o.footnotes),
    snapshots: Array.isArray(o.snapshots) ? o.snapshots.slice(-SNAP_MAX).filter((s) => s && ID_RE.test(s.id || '')).map((s) => ({
      id: s.id, at: String(s.at || ''), label: String(s.label || '').slice(0, 200), auto: !!s.auto, title: String(s.title || '').slice(0, 300), words: +s.words || 0,
      html: sanitizeHtml(String(s.html || ''), true), footnotes: cleanFootnotes(s.footnotes),
      references: Array.isArray(s.references) ? s.references.filter((r) => r && ID_RE.test(r.id || '')).map(cleanRef) : [],
      settings: Object.assign(newDocModel('ar').settings, s.settings || {}) })) : []
  };
}

function safeFileName() {
  const name = ($('#docTitle').value.trim() || t('untitled')).replace(/[\\/:*?"<>|]+/g, '-').slice(0, 120);
  return name;
}

/* ---------- الحالة ---------- */
function setSaveState(kind) {
  const el = $('#saveState');
  el.textContent = t(kind);
  el.classList.toggle('dirty', kind !== 'saved');
}
let _autoT;
function markDirty() {
  WQ.dirty = true;
  if (typeof PV !== 'undefined') { PV.exact = false; PV.stale = true; }
  setSaveState('unsaved');
  maybeAutoSnapshot();
  clearTimeout(_autoT);
  _autoT = setTimeout(autosave, 1200);
}
function autosave() {
  const file = serializeDoc();
  if (lsSet(LS_KEY, { savedAt: nowISO(), dirty: WQ.dirty, file })) setSaveState(WQ.dirty ? 'autosaved' : 'saved');
  updateRecent(file);
}

/* ---------- حفظ ---------- */
let _noteShown = false;
async function saveFile() {
  const json = serializeDoc();
  const base = safeFileName();
  if (WQ.downloads) {
    try {
      await WQ.downloads.save({ filename: base + '.warraq.json', data: json });
      afterSave();
      if (!_noteShown) { _noteShown = true; setTimeout(() => toast(t('previewNote')), 2700); }
    } catch (err) {
      const code = err && err.code;
      toast(code === 'declined' ? t('saveDeclined') : t('saveUnavailable'));
    }
    return;
  }
  // خارج المعاينة (ملف محلي أو نسخة الكمبيوتر): تنزيل مباشر بامتداد \u200E.warraq\u200E
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + '.warraq';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    afterSave();
  } catch (e) { toast(t('saveUnavailable')); }
}
function afterSave() {
  WQ.dirty = false;
  setSaveState('saved');
  autosave();
  toast(t('saveOk'));
}

/* ---------- فتح ---------- */
function openFilePicker() { $('#fileOpen').value = ''; $('#fileOpen').click(); }
function onFileChosen(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const doc = parseDoc(String(r.result));
    if (!doc) { toast(t('openErr')); return; }
    loadDocIntoEditor(doc);
    WQ.dirty = false; setSaveState('saved'); autosave(); renderRibbon();
    toast(t('openOk'));
  };
  r.readAsText(f, 'utf-8');
}

function restoreOrNew() {
  const saved = lsGet(LS_KEY);

  if (doc) {

    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

function alignIcon(w) {
  const lines = { start: ['100%', '70%', '85%'], center: ['100%', '70%', '85%'], end: ['100%', '70%', '85%'], justify: ['100%', '100%', '100%'] }[w];
  const just = w === 'center' ? 'center' : (w === 'end' ? 'flex-end' : 'flex-start');
  return '<span style="display:inline-flex;flex-direction:column;gap:2px;width:16px;align-items:' + just + '">' +
    lines.map((x) => '<span style="height:2px;width:' + x + ';background:currentColor"></span>').join('') + '</span>';
}
function colorBtn(title, command, color) {
  const wrap = el('span', { style: 'display:inline-flex;align-items:center' });
  const btn = rb('<span style="border-bottom:3px solid ' + color + ';padding:0 3px">' + (command === 'foreColor' ? 'A' : '▮') + '</span>', title, () => cmd(command, inp.value));
  const inp = el('input', { type: 'color', value: color, title, 'aria-label': title, style: 'width:18px;height:22px;border:none;padding:0;background:none;cursor:pointer',
    onmousedown: saveRange, onchange: (e) => { restoreRange(); btn.firstChild.style.borderBottomColor = e.target.value; cmd(command, e.target.value); } });
  wrap.append(btn, inp);
  return wrap;
}

function updateToolbarState() {
  $$('[data-state]').forEach((b) => { let on = false; try { on = document.queryCommandState(b.dataset.state); } catch (e) {} b.classList.toggle('on', on); });
  const blk = currentBlock();
  const tag = blk ? (blk.closest('h1,h2,h3,blockquote') || blk).tagName : '';
  $$('[data-block]').forEach((b) => b.classList.toggle('on', b.dataset.block === tag));
}

/* ---------- إعدادات المستند ---------- */
function setSetting(k, v) { WQ.doc.settings[k] = v; applyDocSettings(); markDirty(); refreshDerivedSoon(); }
function setNumerals(mode) { WQ.doc.settings.numerals = mode; applyDocSettings(); convertAllNumerals(); markDirty(); renderRibbon(); updateStatus(); }
function setDocLang(lang) {
  WQ.doc.settings.lang = lang;
  applyDocSettings();
  WQ.doc.settings.numerals = lang === 'ar' ? 'arabic' : 'western';
  convertAllNumerals();
  markDirty(); renderRibbon(); updateStatus();
}

/* ---------- النوافذ ---------- */
function showModal({ title, body, actions = [], onOpen, wide }) {
  const root = $('#modalRoot');
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', esc); };
  const esc = (e) => { if (e.key === 'Escape') close(); };
  const back = el('div', { class: 'modal-back', onclick: (e) => { if (e.target === back) close(); } });
  const m = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  const hd = el('header', {}, [el('span', { html: escapeHtml(title) }), el('button', { html: '×', 'aria-label': t('close'), onclick: close })]);
  const bd = el('div', { class: 'body', html: body });
  const ac = el('div', { class: 'actions' });
  actions.forEach((a) => ac.append(el('button', { class: a.cls || 'btn2', html: escapeHtml(a.label), onclick: () => { const keep = a.run && a.run(m) === false; if (!keep) close(); } })));
  m.append(hd, bd, ac); back.append(m); root.innerHTML = ''; root.append(back);
  document.addEventListener('keydown', esc);
  if (onOpen) onOpen(m);
  const first = m.querySelector('input,select'); if (first) first.focus();
}
function openTableDialog() {
  saveRange();
  showModal({
    title: t('tableTitle'),
    body: '<div class="row"><div><label>' + t('rows') + '</label><input id="tRows" type="number" min="1" max="50" value="3"></div>' +
      '<div><label>' + t('cols') + '</label><input id="tCols" type="number" min="1" max="12" value="3"></div></div>' +
      '<label style="display:flex;gap:6px;align-items:center"><input id="tHead" type="checkbox" checked style="width:auto;margin:0">' + t('headerRow') + '</label>',
    actions: [{ label: t('cancel') }, { label: t('insert'), cls: 'btn', run: (m) => {
      const r = Math.min(50, Math.max(1, +$('#tRows', m).value || 3)), c = Math.min(12, Math.max(1, +$('#tCols', m).value || 3));
      restoreRange(); insertTable(r, c, $('#tHead', m).checked);
    } }]
  });
}
function openPropsDialog() {
  const d = WQ.doc;
  showModal({
    title: t('propsTitle'),
    body: '<label>' + t('title') + '</label><input id="pTitle" dir="auto" value="' + escapeHtml($('#docTitle').value) + '">' +
      '<label>' + t('author') + '</label><input id="pAuthor" dir="auto" value="' + escapeHtml(d.meta.author || '') + '">' +
      '<label>' + t('docLang') + '</label><select id="pLang"><option value="ar">' + t('langAr') + '</option><option value="en">' + t('langEn') + '</option><option value="fr">' + t('langFr') + '</option></select>',
    onOpen: (m) => { $('#pLang', m).value = d.settings.lang; },
    actions: [{ label: t('cancel') }, { label: t('ok'), cls: 'btn', run: (m) => {
      $('#docTitle').value = $('#pTitle', m).value.trim(); d.meta.author = $('#pAuthor', m).value.trim();
      const lang = $('#pLang', m).value; if (lang !== d.settings.lang) setDocLang(lang); else markDirty();
    } }]
  });
}
function openGoalDialog() {
  showModal({
    title: t('goalTitle'),
    body: '<label>' + t('goalLabel') + '</label><input id="gVal" type="number" min="50" step="50" value="' + WQ.prefs.dailyGoal + '">',
    actions: [{ label: t('cancel') }, { label: t('ok'), cls: 'btn', run: (m) => { WQ.prefs.dailyGoal = Math.max(50, +$('#gVal', m).value || 1000); savePrefs(); updateStatus(); } }]
  });
}

/* ---------- شريط الحالة وهدف اليوم ---------- */
function updateStatus() {
  if (!page) return;
  const { words, chars } = countWords();
  const p = WQ.prefs;
  // الهدف اليومي يحسب الكلمات اللي اتكتبت فعلاً، مش اللي اتفتحت أو اتستوردت
  if (p.goalDay !== todayKey()) { p.goalDay = todayKey(); p.goalDone = 0; savePrefs(); }
  if (WQ._lastWords == null) WQ._lastWords = words;
  const delta = words - WQ._lastWords;
  if (delta > 0 && delta < 400) { p.goalDone = (p.goalDone || 0) + delta; savePrefs(); }
  WQ._lastWords = words;
  const today = p.goalDone || 0;
  $('#stWords').textContent = fmtNum(words) + ' ' + t('words') + ' · ' + fmtNum(chars) + ' ' + t('chars') + ' · ' + fmtNum(approxPages()) + ' ' + (PV.exact ? t('pagesExact') : t('pagesApprox'));
  $('#stGoal').textContent = t('dailyGoal') + ': ' + fmtNum(today) + ' / ' + fmtNum(p.dailyGoal);
  const s = WQ.doc.settings;
  $('#stLang').textContent = t('docLang') + ': ' + I18N[WQ.ui].langLabel[s.lang] + ' · ' + (s.numerals === 'arabic' ? '١٢٣' : '123');
}

/* ---------- تفضيلات الواجهة ---------- */
function savePrefs() { lsSet(LS_PREFS, WQ.prefs); }
function applyPrefs() {
  document.body.classList.toggle('hide-nav', !WQ.prefs.showNav);
  document.body.classList.toggle('hide-ref', !WQ.prefs.showRefs);
  document.documentElement.style.setProperty('--zoom', WQ.prefs.zoom / 100);
}
function applyUiLang() {
  const L = I18N[WQ.ui];
  document.documentElement.lang = WQ.ui; document.documentElement.dir = L.dir;
  $$('[data-i18n]').forEach((e) => { e.textContent = t(e.dataset.i18n); });
  $('#btnUiLang').textContent = L.switchTo;
  $('#btnSnap').textContent = '◷ ' + (WQ.ui === 'ar' ? 'لقطة' : 'Snapshot');
  $('#docTitle').placeholder = t('untitled');
  document.documentElement.style.setProperty('--pb-label', JSON.stringify(t('pageBreakLabel')));
  $('.app-ver').textContent = t('appName') + ' · ' + t('version') + ' ' + APP_VERSION + ' (' + APP_STAGE + ')';
  $('.focus-exit') && ($('.focus-exit').textContent = t('exitFocus'));
  document.title = t('appName') + ' – ' + (WQ.ui === 'ar' ? 'Warraq' : 'ور\u0651اق');
  if (WQ.doc) { applyDocSettings(); renderTabs(); renderRibbon(); renderCitations(); buildNav(); updateStatus(); setSaveState(WQ.dirty ? 'unsaved' : 'saved'); }
}

/* ---------- التشغيل ---------- */
function boot() {
  WQ.prefs = Object.assign(WQ.prefs, lsGet(LS_PREFS) || {});
  WQ.ui = WQ.prefs.ui === 'en' ? 'en' : 'ar';
  document.body.append(el('button', { class: 'btn2 focus-exit', onclick: () => document.body.classList.remove('focus') }));
  initEditor();
  initCiteEvents();
  initPagesEvents();
  restoreOrNew();
  applyPrefs();
  applyUiLang();
  if (!(page.innerText || '').trim()) openStart();
  $('#btnUiLang').onclick = () => { WQ.ui = WQ.ui === 'ar' ? 'en' : 'ar'; WQ.prefs.ui = WQ.ui; savePrefs(); applyUiLang(); };
  $('#docTitle').addEventListener('input', markDirty);
  $('#fileOpen').addEventListener('change', onFileChosen);
  $('#fileDocx').addEventListener('change', onDocxChosen);
  $('#btnSnap').onclick = () => { takeSnapshot(t('manualSnap')); markDirty(); toast(t('snapTaken')); };
  $('#fileImage').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { restoreRange(); insertImage(String(r.result)); }; r.readAsDataURL(f);
  });
  $('#stGoal').onclick = openGoalDialog;
  page.addEventListener('blur', saveRange);
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(false); }
    else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openFilePicker(); }
    else if (mod && e.key.toLowerCase() === 'p') { e.preventDefault(); doPrint(); }
    else if (e.key === 'Escape' && document.body.classList.contains('focus')) document.body.classList.remove('focus');
  });
  // قدرة الحفظ في معاينة Claude (إن و\u064Fجدت)
  initDesktop();
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then((d) => { WQ.downloads = d || null; }).catch(() => {});
    }
  } catch (e) {}
  window.WQ_API = { WQ, exportPDF, exportPNG, drawPage, zipStore, paginate, setPagesView, PV: () => PV, takeSnapshot, restoreSnapshot, applyTemplate, docxToWarraq, loadQuran, insertAyah, searchQuran, openStart, refreshDerived, setCiteStyle, addCitation, addFootnote, insertBlock, renderCitations, apaRef, vanRef, serializeDoc, parseDoc, loadDocIntoEditor, sanitizeHtml, countWords, setDocLang, setNumerals, setBlock, insertTable, newDocModel };
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
